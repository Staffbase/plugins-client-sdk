name: Publish TechDocs Site

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/techdocs.yml"

jobs:
  publish-techdocs-site:
    # Pinned: v16.0.0 needs TECHDOCS_AZURE_ACCOUNT_NAME, which isn't scoped to this repo. See #333.
    uses: Staffbase/gha-workflows/.github/workflows/template_techdocs.yml@6e6c062d84ba4422de03d07b019b75c345f3606e # v17.1.0
    with:
      entity-name: plugins-client-sdk
    secrets:
      azure-account-name: ${{ vars.TECHDOCS_AZURE_ACCOUNT_NAME }}
      azure-account-key: ${{ secrets.TECHDOCS_AZURE_ACCESS_KEY }}
